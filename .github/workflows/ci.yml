name: Product Catalog CI/CD - Helm EKS

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-test-scan-deploy:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------
      # 1. Checkout source code
      # -----------------------------------
      - name: Checkout source code
        uses: actions/checkout@v5

      # -----------------------------------
      # 2. Set up Java
      # -----------------------------------
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # -----------------------------------
      # 3. Build and run automated tests
      # -----------------------------------
      - name: Build and run tests
        run: mvn clean test

      # -----------------------------------
      # 4. Build Docker image
      # -----------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/aayushrajput006/product-catalog-service:${{ github.sha }} \
            .

      # -----------------------------------
      # 5. Security scan
      # -----------------------------------
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/aayushrajput006/product-catalog-service:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # -----------------------------------
      # Deployment steps below run only
      # for actual pushes, not PRs
      # -----------------------------------

      # -----------------------------------
      # 6. Authenticate to GHCR
      # -----------------------------------
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------
      # 7. Push image to GHCR
      # -----------------------------------
      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push \
            ghcr.io/aayushrajput006/product-catalog-service:${{ github.sha }}

      # -----------------------------------
      # 8. Authenticate to AWS using OIDC
      # -----------------------------------
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::893692751471:role/product-catalog-github-actions-role
          aws-region: ap-south-1

      # -----------------------------------
      # 9. Configure kubectl for EKS
      # -----------------------------------
      - name: Update EKS kubeconfig
        if: github.event_name == 'push'
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name product-catalog-eks

      # -----------------------------------
      # 10. Set up Helm
      # -----------------------------------
      - name: Set up Helm
        if: github.event_name == 'push'
        uses: azure/setup-helm@v4

      # -----------------------------------
      # 11. Deploy using Helm
      # -----------------------------------
      - name: Deploy application with Helm
        if: github.event_name == 'push'
        run: |
          helm upgrade --install product-catalog ./product-catalog-chart \
            --set image.tag=${{ github.sha }} \
            --force-conflicts \
            --wait \
            --timeout 5m

      # -----------------------------------
      # 12. Verify Helm release
      # -----------------------------------
      - name: Verify Helm release
        if: github.event_name == 'push'
        run: |
          echo "===== Helm Status ====="
          helm status product-catalog

          echo "===== Helm History ====="
          helm history product-catalog

      # -----------------------------------
      # 13. Verify Kubernetes deployment
      # -----------------------------------
      - name: Verify Kubernetes deployment
        if: github.event_name == 'push'
        run: |
          echo "===== Pods ====="
          kubectl get pods

          echo "===== Deployment ====="
          kubectl get deployment product-catalog-service

          echo "===== Rollout History ====="
          kubectl rollout history deployment/product-catalog-service

          echo "===== Service ====="
          kubectl get service product-catalog-service

      # -----------------------------------
      # 14. Verify deployed image
      # -----------------------------------
      - name: Verify deployed image
        if: github.event_name == 'push'
        run: |
          echo "Expected image:"
          echo "ghcr.io/aayushrajput006/product-catalog-service:${{ github.sha }}"

          echo "Currently deployed image:"
          kubectl get deployment product-catalog-service \
            -o jsonpath="{.spec.template.spec.containers[0].image}"

          echo